name: Crawler CCTV News

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-cctv-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run CCTV news crawler
        run: uv run python -m crawler_cctv_news.main

      - name: Commit and push news data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f output/ || true
          git diff --staged --quiet || git commit -m "chore: update cctv news data $(date +%Y-%m-%d)"
          git push